apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: monte-carlo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: monte-carlo-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scheduler.py"]
          envFrom:
            - secretRef:
                name: backend-secret
            - secretRef:
                name: backend-db-secret

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: monte-carlo
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: monte-carlo-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - secretRef:
                name: backend-secret
            - secretRef:
                name: backend-db-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi